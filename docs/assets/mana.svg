  <use href="#crystal"/>
  <g transform="translate(164 36)">
    <use href="#letters" transform="translate(8 8)" fill="#343491"/>
    <use href="#letters" stroke="#343491" stroke-width="3" fill="url(#face)"/>
    <g clip-path="url(#letter-clip)">
      <path d="M0 28H496V36H0ZM0 66H496V82H0ZM0 96H496V108H0Z" fill="url(#dither)" opacity=".42"/>
